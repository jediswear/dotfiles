env = GDK_SCALE,1
monitor = HDMI-A-2, preferred,auto,auto
monitor = HDMI-A-1, preferred, auto, 1

workspace = 1, monitor:HDMI-A-1
workspace = 2, monitor:HDMI-A-2
workspace = 3, monitor:HDMI-A-2
workspace = 4, monitor:HDMI-A-2
workspace = 5, monitor:HDMI-A-2

windowrule = match:class google-chrome, workspace 1
windowrule = match:class jetbrains-webstorm, workspace 2
windowrule = match:class obsidian, workspace 3
windowrule = match:class com.mitchellh.ghostty, workspace 5
windowrule = match:class org\.telegram.+, workspace 4
windowrule = match:class slack, workspace 4
windowrule = match:class discord, workspace 4

windowrule = match:class chrome-chatgpt.com__-Default, float on, max_size 800 600
windowrule = match:class jetbrains-webstorm, no_blur on, opacity 1 override

# blur walker
layerrule = blur on, match:namespace walker
layerrule = ignore_alpha 0.5, match:namespace walker
